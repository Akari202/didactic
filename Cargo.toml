[package]
name = "didactic"
version = "0.1.2"
edition = "2024"
authors = ["Akari Harada <akaritwo0two@gmail.com>"]
description = "A simple typst and tera based static site generator"
license = "	GPL-3.0-only"
repository = "https://github.com/Akari202/didactic"
homepage = "https://akada.dev/didactic/"
keywords = ["ssg", "tera", "typst"]
exclude = [".github/", ".gitignore", "content/", "rustfmt.toml", "test/"]

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
env_logger = "0.11.9"
grass = "0.13.4"
log = "0.4.29"
minify-html = "0.18.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
tera = "1.20.1"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["local-offset"] }
toml = "1.0.2"
typst = { version = "0.14.2" }
typst-assets = { version = "0.14.2", features = ["fonts"] }
typst-html = { version = "0.14.2" }
typst-kit = { version = "0.14.2", features = [
  "embedded-fonts",
  "scan-fonts",
  "universe-packages"
] }
typst-syntax = { version = "0.14.2" }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

comemo = "0.4.0"
ecow = "0.2.6"

[patch.crates-io]
typst = { git = "https://github.com/typst/typst", rev = "e45d37b" }
typst-html = { git = "https://github.com/typst/typst", rev = "e45d37b" }
typst-kit = { git = "https://github.com/typst/typst", rev = "e45d37b" }
typst-syntax = { git = "https://github.com/typst/typst", rev = "e45d37b" }
